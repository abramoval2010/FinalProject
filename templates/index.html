<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои записи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Дневник</h1>
        <a href="{{ url_for('create') }}" class="btn">➕ Создать карточку</a>
        <a href="{{ url_for('logout') }}" class="btn logout">🚪 Выйти</a>

        <div class="cards">
            {% for card in cards %}
            <div class="card">
                <h2>{{ card.title }}</h2>
                <h3>{{ card.subtitle }}</h3>
                <p>{{ card.text[:100] }}{% if card.text|length > 100 %}...{% endif %}</p>
                <a href="{{ url_for('card', id=card.id) }}">Читать далее</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
